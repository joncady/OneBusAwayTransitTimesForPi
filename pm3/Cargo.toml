[package]
name = "pm3-transit-prototype"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "pm3-transit-prototype"

[features]
# Reader launch/file maintenance is separate from the normal display build.
reader-maintenance = []

[[bin]]
name = "reader-files"
path = "src/bin/reader-files.rs"
required-features = ["reader-maintenance"]

[[bin]]
name = "reader-trial"
path = "src/bin/reader-trial.rs"
required-features = ["reader-maintenance"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
slint = { version = "=1.14.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
